name: Atender solicitudes de Brokerap

# Brokerap no puede correr Python ni guarda las llaves de Apify/IA: cuando
# Daniel pide algo desde la web (🔄 actualizar todo, o aprender de un motivo
# de descarte), la web deja una marca en la tabla `meta` y este workflow la
# atiende. El chequeo corre cada 10 minutos pero es casi gratis (un SELECT
# con psql): solo se instala Python y se gasta Apify/IA si hay algo pendiente.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # keepalive: evita que GitHub apague el cron a los 60 días

# Nunca dos corridas a la vez (la completa puede tardar 40 min).
concurrency:
  group: solicitudes-brokerap
  cancel-in-progress: false

jobs:
  atender:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ¿Hay solicitudes pendientes?
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FULL=$(psql "$DATABASE_URL" -tAc "SELECT valor FROM meta WHERE clave='solicitud_actualizar'" || true)
          AFINAR=$(psql "$DATABASE_URL" -tAc "SELECT valor FROM meta WHERE clave='solicitud_afinar'" || true)
          echo "Actualizar: '${FULL}' · Afinar: '${AFINAR}'"
          echo "full=$([ -n "${FULL// }" ] && echo si || echo no)" >> "$GITHUB_OUTPUT"
          echo "afinar=$([ -n "${AFINAR// }" ] && echo si || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.full == 'si' || steps.check.outputs.afinar == 'si'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.full == 'si' || steps.check.outputs.afinar == 'si'
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        if: steps.check.outputs.full == 'si' || steps.check.outputs.afinar == 'si'
        run: pip install -r requirements.txt

      - name: Actualización completa (IG + portales + IA + radar)
        if: steps.check.outputs.full == 'si'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python job_actualizar.py

      - name: Afinación rápida (motivos de descarte → filtros + radar)
        if: steps.check.outputs.full == 'no' && steps.check.outputs.afinar == 'si'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python job_afinar.py

      # GitHub desactiva los crons tras 60 días sin commits; mini-commit de
      # mantenimiento cuando hace falta (sin acciones de terceros: bloqueadas).
      - name: Mantener vivo el robot (keepalive)
        if: steps.check.outputs.full == 'si' || steps.check.outputs.afinar == 'si'
        run: |
          DIAS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$DIAS" -ge 50 ]; then
            git config user.name "robot-nova"
            git config user.email "robot@nova.local"
            git commit --allow-empty -m "keepalive: mantener el robot activo"
            git push
          fi
